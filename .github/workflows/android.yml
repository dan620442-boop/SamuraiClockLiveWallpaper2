
name: Build Samurai Clock APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q SamuraiClockLiveWallpaper-GitHub-ready.zip \
            -d "$RUNNER_TEMP/project"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ runner.temp }}/project/SamuraiClockLiveWallpaper
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamuraiClock-APK
          path: ${{ runner.temp }}/project/SamuraiClockLiveWallpaper/app/build/outputs/apk/debug/app-debug.apk
