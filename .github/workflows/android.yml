
name: Build Samurai Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q SamuraiClockLiveWallpaper-GitHub-ready.zip -d "$RUNNER_TEMP/project"

      - name: Fix Android source files
        working-directory: ${{ runner.temp }}/project/SamuraiClockLiveWallpaper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          xml = Path("app/src/main/res/xml/wallpaper.xml")
          content = xml.read_text()

          content, count = re.subn(
              r'android:description="[^"]*"',
              'android:description="@string/wallpaper_description"',
              content
          )
          if count == 0:
              raise SystemExit("Wallpaper description not found")

          xml.write_text(content)

          values = Path("app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)
          strings = values / "strings.xml"

          description = '<string name="wallpaper_description">Live clock over samurai and cherry blossom artwork</string>'

          if strings.exists():
              content = strings.read_text()
              if "wallpaper_description" not in content:
                  content = content.replace("</resources>", f"    {description}\n</resources>")
                  strings.write_text(content)
          else:
              strings.write_text(f"<resources>\n    {description}\n</resources>\n")

          java = Path("app/src/main/java/com/example/samuraiclock/SamuraiWallpaperService.java")
          code = java.read_text()

          old = 'Typeface.create("sans-serif", Typeface.MEDIUM)'
          new = 'Typeface.create("sans-serif-medium", Typeface.NORMAL)'

          if old not in code:
              raise SystemExit("Expected Typeface.MEDIUM expression not found")

          java.write_text(code.replace(old, new))
          print("XML and Java fixes applied successfully.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ runner.temp }}/project/SamuraiClockLiveWallpaper
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamuraiClock-APK
          path: ${{ runner.temp }}/project/SamuraiClockLiveWallpaper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
