name: Build Samurai Clock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q SamuraiClockLiveWallpaper-GitHub-ready.zip -d "$RUNNER_TEMP/project"

      - name: Fix wallpaper description resource
        working-directory: ${{ runner.temp }}/project/SamuraiClockLiveWallpaper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          xml = Path("app/src/main/res/xml/wallpaper.xml")
          content = xml.read_text()

          content, count = re.subn(
              r'android:description="[^"]*"',
              'android:description="@string/wallpaper_description"',
              content
          )

          if count == 0:
              raise SystemExit("Could not find android:description in wallpaper.xml")

          xml.write_text(content)

          values = Path("app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)

          strings = values / "strings.xml"
          if strings.exists():
              existing = strings.read_text()
              if "wallpaper_description" not in existing:
                  existing = existing.replace(
                      "</resources>",
                      '    <string name="wallpaper_description">Live clock over samurai and cherry blossom artwork</string>\n</resources>'
                  )
                  strings.write_text(existing)
          else:
              strings.write_text(
                  '<resources>\n'
                  '    <string name="wallpaper_description">Live clock over samurai and cherry blossom artwork</string>\n'
                  '</resources>\n'
              )

          print("Wallpaper description fixed successfully.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ runner.temp }}/project/SamuraiClockLiveWallpaper
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamuraiClock-APK
          path: ${{ runner.temp }}/project/SamuraiClockLiveWallpaper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
